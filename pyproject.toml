[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trenchnet"
version = "0.1.0"
description = "Follow a selected group of pump.fun traders, connect their trades in a graph, and paper/live trade on confluence signals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.8",
    "pydantic>=2.7",
    "websockets>=13",
    "httpx>=0.27",
    "solders>=0.29",  # decodes v1 (Sept 2026) transactions; signs live orders
]

[project.optional-dependencies]
live = []  # kept so older install commands still work; solders is now always installed
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
trenchnet = "trenchnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
