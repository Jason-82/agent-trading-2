[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trenchnet"
version = "0.1.0"
description = "Follow a selected group of pump.fun traders, connect their trades in a graph, and paper/live trade on confluence signals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.8",
    "pydantic>=2.7",
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
live = ["solders>=0.21"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "solders>=0.21"]

[project.scripts]
trenchnet = "trenchnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
